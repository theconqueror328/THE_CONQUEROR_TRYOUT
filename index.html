<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>THE ⚔ CONQUEROR | Guild Tryouts</title>
</head>

<body>

    <h1>THEㅤ⚔ㅤCONQUEROR</h1>

    <h2>GUILD TRYOUTS ARE OPEN</h2>

    <p>
        Think you have what it takes?
        Apply for THEㅤ⚔ㅤCONQUEROR guild tryouts.
    </p>

    <a href="#apply">APPLY NOW</a>


    <hr>


    <h2 id="apply">TRYOUT APPLICATION</h2>

    <form>

        <label>
            In-Game Name
            <br>
            <input type="text" name="ign" required>
        </label>

        <br><br>

        <label>
            Free Fire UID
            <br>
            <input type="text" name="uid" required>
        </label>

        <br><br>

        <label>
            WhatsApp / Contact
            <br>
            <input type="text" name="contact" required>
        </label>

        <br><br>

        <label>
            Main Role
            <br>

            <select name="role" required>
                <option value="">Choose your role</option>
                <option>Rusher</option>
                <option>Sniper</option>
                <option>Support</option>
                <option>IGL</option>
                <option>All-Rounder</option>
            </select>
        </label>

        <br><br>

        <label>
            Current Rank
            <br>
            <input type="text" name="rank" required>
        </label>

        <br><br>

        <label>
            Headshot %
            <br>
            <input type="text" name="headshot">
        </label>

        <br><br>

        <label>
            BR / CS
            <br>

            <select name="mode" required>
                <option value="">Choose mode</option>
                <option>BR</option>
                <option>CS</option>
                <option>Both</option>
            </select>
        </label>

        <br><br>

        <label>
            Microphone
            <br>

            <select name="mic" required>
                <option value="">Choose</option>
                <option>Yes</option>
                <option>No</option>
            </select>
        </label>

        <br><br>

        <label>
            Previous Guild / Team
            <br>
            <input type="text" name="previous">
        </label>

        <br><br>

        <label>
            Why do you want to join THEㅤ⚔ㅤCONQUEROR?
            <br>

            <textarea
                name="reason"
                rows="6"
                required>
            </textarea>
        </label>

        <br><br>

        <button type="submit">
            ⚔ SUBMIT APPLICATION
        </button>

    </form>

</body>
</html>
